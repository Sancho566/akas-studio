  <head>

    <meta

      content="interior design contact, architecture firm contact, design consultation"
    />

    <link rel="icon" href="images/akaslogo.png" type="image/png" />

  <body class="bg-gray-50">
    
    <nav class="fixed w-full bg-black shadow-sm z-50">

          <a href="index.html" class="flex-shrink-0">

        </div>
      </div>

      <div
        id="mobile-menu"
        class="hidden absolute top-full left-0 w-screen bg-black shadow-lg z-40"
      >
        <div class="flex flex-col items-start px-6 py-4 space-y-2">
          <a
            href="index.html"
            class="w-full py-2 font-medium text-white hover:text-gray-300"
            >HOME</a
          >
          <a
            href="about.html"
            class="w-full py-2 font-medium text-white hover:text-gray-300"
            >ABOUT</a
          >
          <a
            href="portfolio.html"
            class="w-full py-2 font-medium text-white hover:text-gray-300"
            >PORTFOLIO</a
          >
          <a
            href="contact.html"
            class="w-full py-2 font-medium text-white hover:text-gray-300"
            >CONTACT</a
          >

          <div class="flex space-x-4 pt-2">
            <a
              href="https://www.instagram.com/akasstudio/?hl=en"
              class="text-white hover:text-gray-300"
            >
              <i class="fab fa-instagram"></i>
            </a>
            <a
              href="https://www.linkedin.com/company/akas-studio/"
              class="text-white hover:text-gray-300"
            >
              <i class="fab fa-linkedin-in"></i>
            </a>
            <a
              href="https://vimeo.com/1084278716/5a9ea08108"
              class="text-white hover:text-gray-300"
            >
              <i class="fab fa-vimeo-v"></i>
            </a>
          </div>
        </div>
      </div>
    </nav>

    <section class="pt-32 pb-20 bg-white text-black">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex flex-col lg:flex-row gap-12">
          <div class="lg:w-1/2">
            <h2 class="text-xl md:text-2xl font-bold text-black mb-8">
              Send Us a Message
            </h2>
            <form id="contactForm" class="space-y-6">
              <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                  <label
                    for="firstName"
                    class="block text-sm font-medium text-black mb-1"
                    >First Name*</label
                  >
                  <input
                    type="text"
                    id="firstName"
                    name="firstName"
                    required
                    class="input-field w-full px-4 py-3 border border-black rounded-md focus:border-black"
                  />
                </div>
                <div>
                  <label
                    for="lastName"
                    class="block text-sm font-medium text-black mb-1"
                    >Last Name*</label
                  >
                  <input
                    type="text"
                    id="lastName"
                    name="lastName"
                    required
                    class="input-field w-full px-4 py-3 border border-black rounded-md focus:border-black"
                  />
                </div>
              </div>
              <div>
                <label
                  for="email"
                  class="block text-sm font-medium text-black mb-1"
                  >Email*</label
                >
                <input
                  type="email"
                  id="email"
                  name="email"
                  required
                  class="input-field w-full px-4 py-3 border border-black rounded-md focus:border-black"
                />
              </div>
              <div>
                <label
                  for="phone"
                  class="block text-sm font-medium text-black mb-1"
                  >Phone</label
                >
                <input
                  type="tel"
                  id="phone"
                  name="phone"
                  class="input-field w-full px-4 py-3 border border-black rounded-md focus:border-black"
                />
              </div>
              <div>
                <label
                  for="service"
                  class="block text-sm font-medium text-black mb-1"
                  >Service Interested In</label
                >
                <select
                  id="service"
                  name="service"
                  class="input-field w-full px-4 py-3 border border-black rounded-md focus:border-black"
                >
                  <option value="">Select a service</option>
                  <option value="residential">
                    Single residential/ Multi-residential
                  </option>
                  <option value="retail">Retail/ brand experiences</option>
                  <option value="commercial">Hospitality development</option>
                  <option value="corporate">
                    Corporate (offices and brand experiences)
                  </option>
                  <option value="procurement">FFE Procurement</option>
                  <option value="other">Other</option>
                </select>
              </div>
              <div>
                <label
                  for="message"
                  class="block text-sm font-medium text-black mb-1"
                  >Your Message*</label
                >
                <textarea
                  id="message"
                  name="message"
                  rows="5"
                  required
                  class="input-field w-full px-4 py-3 border border-black rounded-md focus:border-black"
                ></textarea>
              </div>
              <button
                type="submit"
                class="w-full bg-black hover:bg-black text-white px-6 py-4 rounded-md font-medium transition duration-300"
              >
                Send Message <i class="fas fa-paper-plane ml-2"></i>
              </button>
            </form>
          </div>

          <div class="lg:w-1/2">
            <h2 class="text-xl md:text-2xl font-bold text-black mb-8">
              Contact Information
            </h2>
            <div class="space-y-8">
              <div class="flex items-start">
                <div
                  class="flex-shrink-0 bg-gray-200 p-3 rounded-full text-black"
                >
                  <i class="fas fa-map-marker-alt text-xl"></i>
                </div>
                <div class="ml-4">
                  <h3 class="text-lg font-semibold text-black">Our Studio,</h3>
                  <p class="text-black mt-1">Cape Town, South Africa.</p>
                </div>
              </div>
              <div class="flex items-start">
                <div
                  class="flex-shrink-0 bg-gray-200 p-3 rounded-full text-black"
                >
                  <i class="fas fa-phone-alt text-xl"></i>
                </div>
                <div class="ml-4">
                  <h3 class="text-lg font-semibold text-black">Call Us</h3>
                  <p class="text-black mt-1">
                    <a href="tel:+12125551234" class="hover:text-gray-800"
                      >+27 74 260 3393</a
                    ><br />
                  </p>
                </div>
              </div>
              <div class="flex items-start">
                <div
                  class="flex-shrink-0 bg-gray-200 p-3 rounded-full text-black"
                >
                  <i class="fas fa-envelope text-xl"></i>
                </div>
                <div class="ml-4">
                  <h3 class="text-lg font-semibold text-black">Email Us</h3>
                  <p class="text-black mt-1">
                    <a
                      href="mailto:info@akasstudio.com"
                      class="hover:text-gray-800"
                      >info@akasstudio.co.za</a
                    ><br />
                  </p>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>

    <footer class="bg-black text-white font-sans">
      <div
        class="max-w-7xl mx-auto py-6 px-4 flex flex-wrap items-center justify-between gap-6"
      >
        <div class="flex justify-start w-full sm:w-auto">
          <a href="index.html" class="flex items-center">
            <img
              src="images/logo.png"
              alt="AKAS STUDIO Logo"
              class="h-12 w-auto object-contain opacity-90 hover:opacity-100 transition-opacity"
            />
          </a>
        </div>

        <div
          class="flex flex-col items-center justify-center w-full sm:w-auto text-center"
        >
          <div class="flex items-center gap-6 mb-3">
            <a
              href="https://www.instagram.com/akasstudio/?hl=en"
              class="text-white hover:text-gray-300"
            >
              <i class="fab fa-instagram"></i>
            </a>
            <a
              href="https://www.linkedin.com/company/akas-studio/"
              class="text-white hover:text-gray-300"
            >
              <i class="fab fa-linkedin-in"></i>
            </a>
            <a
              href="https://vimeo.com/1084278716/5a9ea08108"
              class="text-white hover:text-gray-300"

          <span class="text-xs">© AKAS STUDIO 2025. All Rights Reserved.</span>
        </div>

        <div class="flex justify-end w-full sm:w-auto text-right text-xs">
          <div>
            <div>+27 74 260 3393</div>
            <div>info@akasstudio.co.za</div>
            <div>Cape Town, South Africa</div>
          </div>
        </div>
      </div>
    </footer>
